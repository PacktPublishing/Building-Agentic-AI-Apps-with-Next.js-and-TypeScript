name: Companion application checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  companion:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: agentic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d agentic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://test_user:test_password@localhost:5432/agentic_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Record toolchain and commit
        run: |
          git rev-parse HEAD
          node --version
          pnpm --version
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile
      - name: STDIO MCP checks
        run: pnpm --filter mcp-amadeus-stdio test && pnpm --filter mcp-amadeus-stdio build
      - name: HTTP MCP checks
        run: pnpm --filter mcp-amadeus test && pnpm --filter mcp-amadeus exec tsc --noEmit && pnpm --filter mcp-amadeus build
      - name: Travel application release gate
        run: pnpm --filter my-v0-project check
