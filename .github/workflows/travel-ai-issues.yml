name: Travel AI issue regression tests

on:
  pull_request:
    paths:
      - 'travel-ai/**'
      - '.github/workflows/travel-ai-issues.yml'
  push:
    branches: [feat/rag, main]
    paths:
      - 'travel-ai/**'
      - '.github/workflows/travel-ai-issues.yml'

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-ai
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:issues
